name: Android CI

on:
  pull_request:
    branches: [ "development" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GED_SERVER_URL: ${{ secrets.GED_SERVER_URL }}
      LOCAL_SERVER_URL: ${{ secrets.LOCAL_SERVER_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle build cache
        uses: actions/cache@v3
        with:
          path: ~/.gradle/build-cache
          key: gradle-buildcache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-buildcache-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up server URLs
        run: |
          echo "GED_SERVER_URL=$GED_SERVER_URL" >> $GITHUB_WORKSPACE/gradle.properties
          echo "LOCAL_SERVER_URL=$LOCAL_SERVER_URL" >> $GITHUB_WORKSPACE/gradle.properties

      - name: Build
        run: ./gradlew build

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
