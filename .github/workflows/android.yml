name: Android CI

on:
  pull_request:
    branches:
    - 'development'
    - 'release/*'

env:
  SERVER_URL: ${{ secrets.SERVER_URL }}
  ORACLE_BUCKET_URL: ${{ secrets.ORACLE_BUCKET_URL }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}

jobs:
  assemble_debug:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'development'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

  assemble_release:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.base.ref, 'release/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download configuration files
        run: |
          rm -f app/google-services.json
          curl "$ORACLE_BUCKET_URL"/google-services.json -o app/google-services.json

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/$KEYSTORE_PATH

      - name: Build release App Bundle
        run: ./gradlew bundleRelease

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: app/build/outputs/bundle/release/app-release.aab